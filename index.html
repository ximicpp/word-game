<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1222">
<title>词网点灯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Charis+SIL&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 夜空里的一张词网占满主区域，右侧（手机为下方）是单词与答题面板。单一深色主题。 */
:root{
  --sky:#0b1222; --sky-2:#111a2e; --panel:#141e34; --rule:#26324d;
  --ink:#e9edf6; --muted:#8e9ab5; --dim:#3a4664;
  --lamp:#ffc95c; --lamp-soft:rgba(255,201,92,.18);
  --ready:#9fd8ff; --good:#7fe0a3; --bad:#ff7d8f;
  --t-sound:#6ea8ff; --t-form:#ff9466; --t-syn:#7fe0a3; --t-ant:#ff6f91;
  --t-root:#c49bff; --t-coll:#4fd6e3; --t-topic:#c7cf6d; --t-hyper:#f0a6d6;
  --f-word:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-cn:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-ipa:"Charis SIL","Doulos SIL","Lucida Sans Unicode","Times New Roman",serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--sky);color:var(--ink);font-family:var(--f-cn);font-size:15px;line-height:1.55;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ready);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;}
header{padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;border-bottom:1px solid var(--rule);background:var(--sky-2)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.04em}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.prog{flex:1 1 320px;display:flex;align-items:center;gap:14px;min-width:0}
.bar{flex:1;height:8px;border-radius:99px;background:var(--rule);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f6a93b,var(--lamp));box-shadow:0 0 12px var(--lamp);transition:width .6s ease}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.count b{color:var(--lamp);font-size:18px}
.stat{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ghost{background:none;border:1px solid var(--rule);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}

main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;
  background:radial-gradient(1200px 700px at 30% 20%,#16213d 0%,var(--sky) 60%)}
#net{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#net.dragging{cursor:grabbing}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 90px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:12px;
  background:rgba(20,30,52,.85);border:1px solid var(--rule);color:var(--ink)}
.chip i{width:14px;height:3px;border-radius:2px;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.4}
.chip[aria-pressed="false"] i{background:var(--dim)}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:8px;background:rgba(20,30,52,.9);border:1px solid var(--rule);font-size:16px}

/* 网络图 */
.edge{stroke-width:1.2;opacity:.16;transition:opacity .4s,stroke-width .4s}
.edge.half{opacity:.4}
.edge.lit{opacity:.95;stroke-width:2}
.edge.hl{opacity:1;stroke-width:2.6}
.edge.off{display:none}
.node{cursor:pointer}
.node .dot{fill:var(--dim);stroke:none;transition:fill .4s}
.node .ring{fill:none;stroke:none}
.node .halo{fill:var(--lamp);opacity:0;transition:opacity .6s}
.node text{font-family:var(--f-word);font-size:13px;fill:var(--muted);paint-order:stroke;stroke:var(--sky);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.node.ready .dot{fill:var(--sky)}
.node.ready .ring{stroke:var(--ready);stroke-width:2;stroke-dasharray:3 3;animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.node.ready text{fill:var(--ink)}
.node.lit .dot{fill:var(--lamp)}
.node.lit .halo{opacity:.22}
.node.lit text{fill:#fff3d6;font-weight:700}
.node.sel .ring{stroke:#fff;stroke-width:2;stroke-dasharray:none;animation:none}
.node.dim{opacity:.35}
.node:focus{outline:none}
.node:focus-visible .ring{stroke:#fff;stroke-width:2}
.node.pop .halo{animation:pop 1.2s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{opacity:.9;transform:scale(.6)}100%{opacity:.22;transform:scale(1)}}
.node .halo{transform-box:fill-box;transform-origin:center}

/* 面板 */
aside{border-left:1px solid var(--rule);background:var(--panel);overflow:auto;min-height:0;
  padding-block:20px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.word{font-family:var(--f-word);font-weight:700;font-size:40px;line-height:1.1;margin:6px 0 2px;letter-spacing:-.01em}
.ipa{font-family:var(--f-ipa);font-size:18px;color:var(--muted)}
.cn{font-size:18px;margin-top:8px}
.hidden-cn{color:var(--muted);font-size:14px;margin-top:8px}
.ex{margin-top:10px;font-family:var(--f-word);font-weight:500;color:#cfd6e6;font-size:15px;border-left:2px solid var(--rule);padding-left:10px}
.state{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--rule)}
.state.lit{color:var(--lamp);border-color:rgba(255,201,92,.5)}
.state.ready{color:var(--ready);border-color:rgba(159,216,255,.45)}
.state.locked{color:var(--muted)}
.sec{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.group{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:start}
.group .t{font-size:12px;color:var(--c);padding-top:4px;display:flex;align-items:center;gap:6px}
.group .t::before{content:"";width:10px;height:3px;border-radius:2px;background:var(--c)}
.nbs{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.nb{font-family:var(--f-word);font-size:14px;padding:3px 10px;border-radius:8px;background:var(--sky-2);border:1px solid var(--rule)}
.nb.lit{border-color:rgba(255,201,92,.55);color:var(--lamp)}
.nb.ready{border-color:rgba(159,216,255,.4)}
.nb:hover{border-color:var(--ink)}
.cta{margin-top:22px;width:100%;padding:12px 16px;border-radius:10px;border:none;font-size:16px;font-weight:600;
  background:var(--lamp);color:#2b1d00;box-shadow:0 0 24px rgba(255,201,92,.35)}
.cta:disabled{background:var(--rule);color:var(--muted);box-shadow:none;cursor:not-allowed}
.cta.alt{background:none;border:1px solid var(--rule);color:var(--ink);box-shadow:none}
.note{font-size:13px;color:var(--muted);margin-top:10px}

.qhead{display:flex;justify-content:space-between;align-items:center}
.pips{display:flex;gap:6px}
.pips i{width:22px;height:6px;border-radius:3px;background:var(--rule)}
.pips i.ok{background:var(--good)}
.pips i.now{background:var(--ready)}
.pips i.no{background:var(--bad)}
.q{font-size:18px;margin:16px 0 14px;text-wrap:balance}
.q .w{font-family:var(--f-word);font-weight:700;color:var(--ready)}
.q .sent{display:block;font-family:var(--f-word);font-weight:500;font-size:19px;margin-top:8px;color:var(--ink)}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:10px;background:var(--sky-2);border:1px solid var(--rule);font-size:16px;display:flex;justify-content:space-between;gap:10px}
.opt.en{font-family:var(--f-word);font-weight:500;font-size:18px}
.opt:hover:not(:disabled){border-color:var(--ready)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:rgba(127,224,163,.1)}
.opt.wrong{border-color:var(--bad);background:rgba(255,125,143,.1)}
.opt small{font-family:var(--f-cn);font-size:13px;color:var(--muted);font-weight:400;align-self:center}
.explain{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--sky-2);font-size:14px}
.explain b{color:var(--good)}
.explain.bad b{color:var(--bad)}
.big{font-family:var(--f-word);font-size:46px;font-weight:700;color:var(--lamp);text-shadow:0 0 28px rgba(255,201,92,.6);margin:8px 0}
.unlocked{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.modal{position:fixed;inset:0;background:rgba(5,9,18,.78);display:grid;place-items:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:24px;max-width:460px;width:100%}
.card h2{margin:0 0 6px;font-size:22px}
.card p{margin:0 0 16px;color:var(--muted);font-size:14px}
.starts{display:grid;gap:10px}
.start{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:10px;background:var(--sky-2);border:1px solid var(--rule);text-align:left}
.start:hover{border-color:var(--lamp)}
.start b{font-family:var(--f-word);font-size:22px}
.start span{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;margin-top:8px}
.row .cta{margin-top:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--lamp);color:#2b1d00;
  padding:8px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:30;box-shadow:0 0 30px rgba(255,201,92,.5)}


/* 星级、变暗、星座 */
.node.lit.s1 .halo{opacity:.09}
.node.lit.s2 .halo{opacity:.17}
.node.lit.s3 .halo{opacity:.3}
.node.lit.s1 .dot,.node.lit.s2 .dot{transform-box:fill-box;transform-origin:center}
.node.lit.s1 .dot{transform:scale(.75)}
.node.lit.fade .dot{fill:#8a7440}
.node.lit.fade .halo{opacity:.04}
.node.lit.fade text{fill:#b9a676;font-weight:500}
.node.lit.fade .ring{stroke:#b99a5a;stroke-width:1.5;stroke-dasharray:2 3;animation:spin 10s linear infinite;transform-box:fill-box;transform-origin:center}
.node.gone{display:none}
.cglow{stroke:var(--lamp);stroke-width:7;opacity:.16;stroke-linecap:round}
.clabel{font-family:var(--f-cn);font-size:12px;fill:var(--lamp);opacity:.75;paint-order:stroke;stroke:var(--sky);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.super{cursor:pointer}
.super .halo{fill:var(--lamp);opacity:.18;transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
.super .core{fill:var(--lamp);stroke:#fff3d6;stroke-width:2}
.super .rays{stroke:var(--lamp);stroke-width:1.5;opacity:.6}
.super text{font-family:var(--f-cn);font-size:14px;font-weight:700;fill:#fff3d6;paint-order:stroke;stroke:var(--sky);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.super text.n{font-family:var(--f-mono);font-size:11px;font-weight:500;fill:#2b1d00;stroke:none}
.super.fade .core{fill:#8a7440;stroke:#b99a5a}
.super.fade .halo{opacity:.06;animation:none}
.super.sel .core{stroke:#fff;stroke-width:3}
.super.dim{opacity:.35}
.super:focus{outline:none}
.super:focus-visible .core{stroke:var(--ready);stroke-width:3}
.bundle{stroke-width:2.2;opacity:.85}
.bundle.half{opacity:.45;stroke-width:1.6}
.bundle.hl{opacity:1;stroke-width:3}
.bcount circle{fill:var(--sky-2);stroke:var(--rule)}
.bcount text{font-family:var(--f-mono);font-size:10px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.stars{color:var(--lamp);letter-spacing:2px;font-size:18px}
.stars i{font-style:normal;color:var(--dim)}
.combo{font-family:var(--f-mono);font-size:12px;color:var(--lamp);white-space:nowrap}
.combo[hidden]{display:none}
.polish{border-color:rgba(255,201,92,.5);color:var(--lamp)}
.conslist{display:grid;gap:6px}
.consrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;background:var(--sky-2);border:1px solid var(--rule);text-align:left;font-size:14px}
.consrow.done{border-color:rgba(255,201,92,.5);color:var(--lamp)}
.consrow span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.consrow.done span{color:var(--lamp)}
.badge{margin-top:16px;padding:14px;border-radius:10px;border:1px solid rgba(255,201,92,.5);background:var(--lamp-soft)}
.badge b{color:var(--lamp);font-size:18px}
.badge p{margin:6px 0 0;font-size:14px;color:var(--ink)}
.linkrow{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.linkrow b{font-family:var(--f-word);color:var(--ink);font-weight:500}
.linkrow i{font-style:normal;color:var(--c)}
.node .gain{font-family:var(--f-cn);font-size:11px;font-weight:600;fill:var(--ready);stroke:var(--sky);stroke-width:3px;paint-order:stroke;opacity:0;pointer-events:none}
.node.ready .gain{opacity:1}
.diff{display:inline-flex;gap:3px;vertical-align:middle}
.diff i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.diff i.on{background:var(--t-form)}
.dust{color:var(--lamp);font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.preview{margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;color:var(--muted);padding:12px 14px;border-radius:10px;background:var(--sky-2);border:1px solid var(--rule)}
.preview b{color:var(--ink);font-weight:600}
.cands{display:grid;gap:6px}
.cand{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;background:var(--sky-2);border:1px solid rgba(159,216,255,.4);text-align:left;font-size:12px;color:var(--muted)}
.cand b{font-family:var(--f-word);font-size:15px;color:var(--ink);font-weight:500}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tool{background:none;border:1px dashed rgba(255,201,92,.5);color:var(--lamp);border-radius:8px;padding:6px 10px;font-size:13px}
.tool:disabled{opacity:.4;cursor:not-allowed}
.ctabar .cta{margin-top:16px}
.tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;width:min(440px,calc(100% - 32px));
  background:#1b2742;border:1px solid rgba(255,201,92,.6);border-radius:12px;padding:14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.5);display:flex;gap:12px;align-items:flex-start}
.tip p{margin:0;font-size:15px;flex:1}
.tip p b{color:var(--lamp)}
.tip button{flex:none;background:var(--lamp);color:#2b1d00;border:none;border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px}
.opt.cut{opacity:.28;text-decoration:line-through}
.meteor{position:absolute;width:140px;height:2px;border-radius:2px;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,243,214,0),#fff3d6);box-shadow:0 0 10px #ffc95c;transform:rotate(-24deg);animation:fly 1.1s ease-in forwards}
@keyframes fly{0%{opacity:0;translate:0 0}15%{opacity:1}100%{opacity:0;translate:-420px 190px}}

/* 星系切换条 */
.gbar{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;z-index:3;
  padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--sky) 40%,rgba(11,18,34,0))}
.gbar::-webkit-scrollbar{display:none}
.gal{flex:none;display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:13px;background:rgba(20,30,52,.9);border:1px solid var(--rule);color:var(--ink)}
.gal span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.gal.cur{border-color:var(--lamp);color:var(--lamp);box-shadow:0 0 14px rgba(255,201,92,.25)}
.gal.cur span{color:var(--lamp)}
.gal.has{border-color:rgba(159,216,255,.5)}
.gal:disabled{opacity:.38;cursor:not-allowed}
.gal.full{background:var(--lamp-soft)}
#net.far .node.locked text{display:none}
#net.far .node.locked .dot{r:4}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.meta .go{color:var(--lamp)}
.lede{font-size:15px;color:var(--ink);margin:0 0 16px}
.qx{background:none;border:none;color:var(--muted);font-size:13px;padding:2px 4px}
.qx:hover{color:var(--ink)}
.auto{height:3px;border-radius:2px;background:var(--rule);margin-top:12px;overflow:hidden}
.auto i{display:block;height:100%;width:100%;background:var(--good);transform-origin:left;animation:drain var(--d,1.4s) linear forwards}
@keyframes drain{from{transform:scaleX(0)}to{transform:scaleX(1)}}
details.fold{margin-top:22px;border-top:1px solid var(--rule);padding-top:14px}
details.fold summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none;display:flex;justify-content:space-between}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"展开";font-size:12px}
details.fold[open] summary::after{content:"收起"}
details.fold[open] summary{margin-bottom:10px}
.keys{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.keys span{display:inline-flex;align-items:center;gap:5px}
.keys i{width:12px;height:3px;border-radius:2px;background:var(--c)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.links{display:grid;gap:4px;margin-top:8px}
.links div{font-size:13px;color:var(--muted)}
.links b{font-family:var(--f-word);font-weight:500;color:var(--ink)}
.links i{font-style:normal;color:var(--c)}

@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(280px,50%) 1fr}
  aside{border-left:none;border-top:1px solid var(--rule);padding-top:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .word{font-size:32px}
  .big{font-size:38px}
  header{gap:10px;padding-block:9px;flex-wrap:nowrap}
  .brand span{display:none}
  .brand h1{font-size:17px;white-space:nowrap}
  .prog{flex:1 1 60px;gap:8px}
  .bar{min-width:30px}
  .count{font-size:12px}.count b{font-size:15px}
  .ghost{padding:4px 8px}
  main.focus{grid-template-rows:minmax(170px,30%) 1fr}
  .toast{bottom:auto;top:calc(64px + env(safe-area-inset-top,0px))}
  .ctabar{position:sticky;bottom:0;margin:0 -16px;padding:0 16px 12px;background:linear-gradient(transparent,var(--panel) 30%);z-index:2}
  .tip{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
  .zoom button{width:30px;height:30px}
  .zoom{bottom:8px}
  .q{font-size:17px;margin:12px 0 10px}
  .opt{padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand"><h1>词网点灯</h1><span>KET · PET</span></div>
    <div class="prog">
      <div class="count"><b id="litN">0</b> / <span id="totN">0</span></div>
      <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
    </div>
    <div class="dust" id="dustStat" title="星尘：点亮单词获得，答题时可以换提示卡">星尘 0</div>
    <div class="combo" id="comboStat" hidden></div>
    <button class="ghost polish" id="polishBtn" type="button" hidden></button>
    <button class="ghost" id="muteBtn" type="button" aria-pressed="false">音效 开</button>
  </header>
  <main>
    <div class="stage">
      <svg id="net" role="img" aria-label="单词关系网"><g id="vp"><g id="cglow"></g><g id="edges"></g><g id="bundles"></g><g id="nodes"></g><g id="supers"></g></g></svg>
      <nav class="gbar" id="gbar" aria-label="星系"></nav>
      <div class="zoom"><button id="zin" type="button" aria-label="放大">+</button><button id="zout" type="button" aria-label="缩小">−</button><button id="zfit" type="button" aria-label="全部显示">⤢</button></div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="tip" id="tip" role="status" hidden><p></p><button type="button">知道了</button></div>

<script src="data.js"></script>
<script>
(() => {
const D = window.WORDNET;
const WORDS = Object.keys(D.words);
const TYPES = D.types;
const TYPE_ORDER = ["sound","form","syn","ant","root","coll","topic","hyper"];
const GAL = D.galaxies, CONS = D.constellations;
const KEY = "wordnet-progress-v1";
const DAY = 864e5;
const INTERVALS = [1, 3, 7, 14, 30];          // 复习间隔（天）
// 网址加 ?days=N 可以模拟 N 天之后，方便试玩“星光变暗”
const SHIFT = (parseFloat(new URLSearchParams(location.search).get("days")) || 0) * DAY;
const now = () => Date.now() + SHIFT;
const HINT_COST = 30, CONS_BONUS = 30;
const OPEN_STEP = 12;                           // 每点亮 12 个词开放一个新星系
const AUTO_MS = 1300;                           // 答对后自动进入下一题

// ---------- 图结构 ----------
const adj = {}; WORDS.forEach(w => adj[w] = []);
D.edges.forEach(([a,b,t,note], i) => { adj[a].push({w:b,t,note,i}); adj[b].push({w:a,t,note,i}); });
const nbSet = w => new Set(adj[w].map(e => e.w));
function twoHop(w){ const s = new Set(); const one = nbSet(w);
  one.forEach(n => adj[n].forEach(e => { if (e.w !== w && !one.has(e.w)) s.add(e.w); })); return [...s]; }
const gOf = w => D.words[w].g;
const GW = GAL.map(() => []); WORDS.forEach(w => GW[gOf(w)].push(w));
const GE = GAL.map(() => []); D.edges.forEach(([a,b], i) => { if (gOf(a) === gOf(b)) GE[gOf(a)].push(i); });
const GC = GAL.map(() => []); CONS.forEach((c, i) => GC[c.g].push(i));
const consOf = {}; CONS.forEach((c, i) => c.words.forEach(w => consOf[w] = i));
// 难度 1–3：A2 为 1、B1 为 2；读音或字形易混的邻居有 2 个以上再加 1
const DIFF = {}; WORDS.forEach(w => { const n = adj[w].filter(e => e.t === "sound" || e.t === "form").length;
  DIFF[w] = Math.min(3, (D.words[w].lv === "B1" ? 2 : 1) + (n >= 2 ? 1 : 0)); });
const nQ = w => DIFF[w] === 1 ? 2 : 3;          // 题数：简单词 2 题，其余 3 题
const dustFor = (w, stars) => DIFF[w] * 10 + stars * 5;
const diffHtml = w => `<span class="diff" title="难度 ${DIFF[w]}">${[1,2,3].map(k => `<i class="${k <= DIFF[w] ? "on" : ""}"></i>`).join("")}</span>`;

// ---------- 状态 ----------
const fresh = () => ({ v:2, tips:{}, lit:[], answered:0, correct:0, stars:{}, mem:{}, combo:0, best:0, folded:[], dust:30, gal:0, mute:false });
let S = fresh();
function load(){ try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && Array.isArray(v.lit)) S = Object.assign(S, v); } catch(e){}
  S.lit = [...new Set(S.lit.filter(w => D.words[w]))];
  if (S.v !== 2){ S.folded = []; S.v = 2; }        // 旧原型的存档：星座编号变了
  S.lit.forEach(w => { if (!S.stars[w]) S.stars[w] = 3; if (!S.mem[w]) S.mem[w] = {lv:0, due: now() + DAY}; });
  if (!GAL[S.gal]) S.gal = 0;
  recalc(); S.folded = S.folded.filter(i => CONS[i] && consDone(i)); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

let litSet = new Set(), readySet = new Set(), openG = [];
// 点亮集合变化后重新计算：哪些词能挑战、哪些星系已开放
function recalc(){
  litSet = new Set(S.lit); const ra = new Set();
  S.lit.forEach(w => adj[w].forEach(e => { if (!litSet.has(e.w)) ra.add(e.w); }));
  openG = GAL.map((_, g) => g === 0 || S.lit.length >= g * OPEN_STEP || GW[g].some(w => litSet.has(w) || ra.has(w)));
  GAL.forEach((_, g) => { const s = D.starts[g]; if (openG[g] && !litSet.has(s)) ra.add(s); });
  readySet = ra;
}
const isLit = w => litSet.has(w);
const status = w => litSet.has(w) ? "lit" : readySet.has(w) ? "ready" : "locked";
const isFading = w => isLit(w) && S.mem[w] && now() >= S.mem[w].due;
const fadingWords = () => S.lit.filter(isFading);
const consDone = i => CONS[i].words.every(isLit);
const isFolded = i => S.folded.includes(i);
const gainOf = w => [...new Set(adj[w].filter(e => status(e.w) === "locked").map(e => e.w))];
const consLeft = w => consOf[w] === undefined ? null : CONS[consOf[w]].words.filter(x => x !== w && !isLit(x)).length;
const starHtml = n => `<span class="stars" aria-label="${n} 颗星">${"★".repeat(n)}<i>${"★".repeat(3-n)}</i></span>`;
function dueText(w){ const m = S.mem[w]; if (!m) return ""; const d = Math.ceil((m.due - now()) / DAY);
  return d <= 0 ? "星光变暗了，答 1 题就能擦亮" : d === 1 ? "明天需要擦亮一次" : `${d} 天后需要擦亮`; }
// 推荐顺序：当前星系优先 → 能连成星座 → 解锁多 → 难度低
function candidates(prefer){
  const pf = prefer || new Set();
  return [...readySet].map(w => ({w, g: gainOf(w).length, cl: consLeft(w)}))
    .sort((a, b) => ((gOf(b.w) === cur) - (gOf(a.w) === cur)) || (pf.has(b.w) - pf.has(a.w)) || ((b.cl === 0) - (a.cl === 0))
      || (b.g - a.g) || (DIFF[a.w] - DIFF[b.w]) || (a.w < b.w ? -1 : 1));
}

// ---------- 位置 ----------
const P = {}; WORDS.forEach(w => P[w] = {x: D.words[w].p[0], y: D.words[w].p[1]});
const BBg = GAL.map((_, g) => { const xs = GW[g].map(w => P[w].x), ys = GW[g].map(w => P[w].y);
  const x0 = Math.min(...xs), y0 = Math.min(...ys);
  return {x: x0 - 70, y: y0 - 90, w: Math.max(...xs) - x0 + 140, h: Math.max(...ys) - y0 + 150}; });
const CP = CONS.map(c => ({ x: c.words.reduce((s,w) => s + P[w].x, 0) / c.words.length, y: c.words.reduce((s,w) => s + P[w].y, 0) / c.words.length,
  top: Math.min(...c.words.map(w => P[w].y)) }));
// 显示位置：被收起的词显示在它的星座大星上。连线数据本身从不改变。
const rep = w => (consOf[w] !== undefined && isFolded(consOf[w])) ? "c" + consOf[w] : w;
const posOf = id => /^c\d+$/.test(id) ? CP[+id.slice(1)] : P[id];

// ---------- 绘制（一次只画一个星系） ----------
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("net"), gE = document.getElementById("edges"), gN = document.getElementById("nodes");
const gB = document.getElementById("bundles"), gG = document.getElementById("cglow"), gS = document.getElementById("supers");
const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
let cur = 0, BB = BBg[0], edgeEls = [], nodeEls = {}, glowEls = {}, superEls = {};
function build(g){
  cur = g; S.gal = g; BB = BBg[g];
  [gE, gN, gB, gG, gS].forEach(x => x.textContent = "");
  edgeEls = GE[g].map(i => { const [a,b,t] = D.edges[i];
    const l = el("line", {x1:P[a].x,y1:P[a].y,x2:P[b].x,y2:P[b].y,class:"edge",stroke:`var(--t-${t})`}); gE.appendChild(l); return {i, l}; });
  nodeEls = {};
  GW[g].forEach(w => {
    const n = el("g", {class:"node", transform:`translate(${P[w].x},${P[w].y})`, tabindex:"0", role:"button", "aria-label":w});
    n.appendChild(el("circle",{class:"halo",r:22}));
    n.appendChild(el("circle",{class:"ring",r:10}));
    n.appendChild(el("circle",{class:"dot",r:6}));
    const t = el("text",{y:24,"text-anchor":"middle"}); t.textContent = w; n.appendChild(t);
    n.appendChild(el("text",{y:-15,"text-anchor":"middle",class:"gain"}));
    n.dataset.w = w;
    n.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(w); } });
    gN.appendChild(n); nodeEls[w] = n; });
  glowEls = {}; superEls = {};
  GC[g].forEach(i => { const c = CONS[i], set = new Set(c.words);
    const gl = el("g", {});
    GE[g].forEach(k => { const [a,b] = D.edges[k]; if (set.has(a) && set.has(b)) gl.appendChild(el("line", {x1:P[a].x,y1:P[a].y,x2:P[b].x,y2:P[b].y,class:"cglow"})); });
    const t = el("text", {x:CP[i].x, y:CP[i].top - 18, "text-anchor":"middle", class:"clabel"}); t.textContent = c.name; gl.appendChild(t);
    gG.appendChild(gl); glowEls[i] = gl;
    const s = el("g", {class:"super", transform:`translate(${CP[i].x},${CP[i].y})`, tabindex:"0", role:"button", "aria-label":c.name});
    s.appendChild(el("circle", {class:"halo", r:38}));
    const rays = el("g", {class:"rays"});
    for (let k = 0; k < 8; k++){ const a = k * Math.PI / 4, r1 = k % 2 ? 19 : 21, r2 = k % 2 ? 25 : 30;
      rays.appendChild(el("line", {x1:Math.cos(a)*r1, y1:Math.sin(a)*r1, x2:Math.cos(a)*r2, y2:Math.sin(a)*r2})); }
    s.appendChild(rays);
    s.appendChild(el("circle", {class:"core", r:15}));
    const n = el("text", {class:"n", y:1, "text-anchor":"middle", "dominant-baseline":"central"}); n.textContent = c.words.length; s.appendChild(n);
    const tt = el("text", {y:48, "text-anchor":"middle"}); tt.textContent = c.name; s.appendChild(tt);
    s.dataset.c = i;
    s.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectCons(i); } });
    gS.appendChild(s); superEls[i] = s; });
  fitActive();
}
// 收起后的连线：两端换成显示位置，同一对位置之间的多条原始连线合成一束
function bundles(){
  const m = new Map();
  GE[cur].forEach(i => { const [a,b] = D.edges[i]; const ra = rep(a), rb = rep(b);
    if ((ra === a && rb === b) || ra === rb) return;
    const key = [ra, rb].sort().join("|");
    if (!m.has(key)) m.set(key, {ra, rb, list:[]}); m.get(key).list.push(i); });
  return [...m.values()];
}

let selected = null, selCons = null;
function paint(){
  GW[cur].forEach(w => { const n = nodeEls[w], s = status(w);
    n.classList.toggle("lit", s === "lit"); n.classList.toggle("ready", s === "ready"); n.classList.toggle("locked", s === "locked");
    n.classList.toggle("sel", w === selected);
    [1,2,3].forEach(k => n.classList.toggle("s"+k, s === "lit" && (S.stars[w]||3) === k));
    n.classList.toggle("fade", isFading(w)); n.classList.toggle("gone", rep(w) !== w);
    n.querySelector(".gain").textContent = s === "ready" ? (consLeft(w) === 0 ? "连成星座" : gainOf(w).length ? "解锁" + gainOf(w).length : "") : ""; });
  const near = selected ? new Set([...nbSet(selected)].map(rep)) : null;
  const selId = selected || (selCons !== null ? "c" + selCons : null);
  edgeEls.forEach(({i, l}) => { const [a,b] = D.edges[i]; const la = isLit(a), lb = isLit(b);
    l.classList.toggle("lit", la && lb); l.classList.toggle("half", la !== lb);
    l.classList.toggle("hl", !!selected && (a === selected || b === selected));
    l.classList.toggle("off", rep(a) !== a || rep(b) !== b); });
  gB.textContent = "";
  bundles().forEach(bd => { const pa = posOf(bd.ra), pb = posOf(bd.rb);
    const ts = new Set(bd.list.map(i => D.edges[i][2]));
    const allLit = bd.list.every(i => isLit(D.edges[i][0]) && isLit(D.edges[i][1]));
    gB.appendChild(el("line", {x1:pa.x, y1:pa.y, x2:pb.x, y2:pb.y, class:"bundle" + (allLit ? "" : " half") + (selId && (bd.ra === selId || bd.rb === selId) ? " hl" : ""),
      stroke: ts.size === 1 ? `var(--t-${[...ts][0]})` : "#d9dfec"}));
    if (bd.list.length > 1){ const g = el("g", {class:"bcount", transform:`translate(${(pa.x+pb.x)/2},${(pa.y+pb.y)/2})`});
      g.appendChild(el("circle", {r:8})); const t = el("text", {}); t.textContent = bd.list.length; g.appendChild(t); gB.appendChild(g); } });
  GC[cur].forEach(i => { const c = CONS[i], done = consDone(i), f = isFolded(i);
    glowEls[i].style.display = done && !f ? "" : "none";
    const g = superEls[i]; g.style.display = f ? "" : "none";
    g.classList.toggle("fade", c.words.some(isFading)); g.classList.toggle("sel", selCons === i);
    g.classList.toggle("dim", !!selected && !near.has("c" + i)); });
  GW[cur].forEach(w => nodeEls[w].classList.toggle("dim", (!!selected && w !== selected && !near.has(w)) || (selCons !== null && consOf[w] !== selCons)));
  document.getElementById("litN").textContent = S.lit.length;
  document.getElementById("totN").textContent = WORDS.length;
  document.getElementById("barFill").style.width = (S.lit.length / WORDS.length * 100) + "%";
  document.getElementById("dustStat").textContent = `星尘 ${S.dust}`;
  const cb = document.getElementById("comboStat"); cb.hidden = S.combo < 2; cb.textContent = `连击 ×${S.combo}`;
  const pb = document.getElementById("polishBtn"), nf = fadingWords().length; pb.hidden = !nf; pb.textContent = `待擦亮 ${nf}`;
  const mb = document.getElementById("muteBtn"); mb.textContent = S.mute ? "音效 关" : "音效 开"; mb.setAttribute("aria-pressed", String(!S.mute));
  renderBar();
}

// 星系切换条
const gbar = document.getElementById("gbar");
function renderBar(){
  gbar.innerHTML = GAL.map((G, g) => { const n = GW[g].filter(isLit).length, open = openG[g], has = GW[g].some(w => readySet.has(w));
    const need = g * OPEN_STEP - S.lit.length;
    return `<button type="button" class="gal${g === cur ? " cur" : ""}${has && g !== cur ? " has" : ""}${n === GW[g].length ? " full" : ""}" data-g="${g}" ${open ? "" : `disabled title="再点亮 ${need} 个词开放"`}>${esc(G.name)}<span>${open ? `${n}/${GW[g].length}` : "未开放"}</span></button>`; }).join("");
  gbar.querySelectorAll("[data-g]").forEach(b => b.onclick = () => switchGal(+b.dataset.g));
  const c = gbar.querySelector(".cur"); if (c && !gbar.dataset.scrolled){ c.scrollIntoView({inline:"center", block:"nearest"}); gbar.dataset.scrolled = 1; }
}
function switchGal(g){ if (busy()) { toast("先完成这一轮答题"); return; }
  if (g === cur) { fit(); return; }
  selected = null; selCons = null; build(g); save(); paint(); renderPanel(); panel.scrollTop = 0;
  gbar.querySelector(".cur")?.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"}); }

// ---------- 平移缩放 ----------
let vb = {...BB};
function setVB(){ svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const r = svg.getBoundingClientRect(); const scale = Math.max(vb.w / (r.width || 1), vb.h / (r.height || 1));
  svg.classList.toggle("far", scale > 1.15); }      // 缩得很小时，未解锁的词不显示名字
function fit(){ vb = {...BB}; setVB(); }
// 只看已点亮和能挑战的区域（开局时整张星系太大，起点会显得很小）
function fitActive(){ const ws = GW[cur].filter(w => status(w) !== "locked" && rep(w) === w);
  if (!ws.length || ws.length > GW[cur].length * .6) return fit();
  const xs = ws.map(w => P[w].x), ys = ws.map(w => P[w].y);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  const r = svg.getBoundingClientRect(), asp = (r.height || 1) / (r.width || 1);
  const mn = small() ? 460 : 760;
  let w = Math.max(Math.max(...xs) - Math.min(...xs) + 220, mn), h = Math.max(Math.max(...ys) - Math.min(...ys) + 220, mn * asp);
  if (h / w < asp) h = w * asp; else w = h / asp;
  vb = {x: cx - w/2, y: cy - h/2, w, h}; setVB(); }
function zoom(f, cx, cy){ glideT++; const r = svg.getBoundingClientRect(); const scale = Math.max(vb.w / r.width, vb.h / r.height);
  const ox = vb.x + (vb.w - r.width*scale)/2, oy = vb.y + (vb.h - r.height*scale)/2;
  const px = cx === undefined ? vb.x + vb.w/2 : ox + (cx - r.left)*scale, py = cy === undefined ? vb.y + vb.h/2 : oy + (cy - r.top)*scale;
  const nw = Math.min(BB.w*2.5, Math.max(BB.w/8, vb.w*f)), k = nw / vb.w;
  vb = {x: px - (px - vb.x)*k, y: py - (py - vb.y)*k, w: nw, h: vb.h*k}; setVB(); }
document.getElementById("zin").onclick = () => zoom(.75);
document.getElementById("zout").onclick = () => zoom(1.33);
document.getElementById("zfit").onclick = fit;
svg.addEventListener("wheel", e => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.12 : .89, e.clientX, e.clientY); }, {passive:false});
const ptrs = new Map(); let moved = 0, downNode = null, downCons = null, pinch0 = null;
svg.addEventListener("pointerdown", e => { ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY}); moved = 0;
  const n = e.target.closest(".node"); downNode = n ? n.dataset.w : null;
  const c = e.target.closest(".super"); downCons = c ? +c.dataset.c : null;
  svg.setPointerCapture(e.pointerId); svg.classList.add("dragging");
  if (ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x-b.x, a.y-b.y); } });
svg.addEventListener("pointermove", e => { if (!ptrs.has(e.pointerId)) return; const prev = ptrs.get(e.pointerId); const p = {x:e.clientX, y:e.clientY};
  if (ptrs.size === 1){ glideT++; const r = svg.getBoundingClientRect(); const scale = Math.max(vb.w / r.width, vb.h / r.height);
    vb.x -= (p.x-prev.x)*scale; vb.y -= (p.y-prev.y)*scale; setVB(); moved += Math.abs(p.x-prev.x)+Math.abs(p.y-prev.y); }
  ptrs.set(e.pointerId, p);
  if (ptrs.size === 2 && pinch0){ const [a,b] = [...ptrs.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y); zoom(pinch0/d, (a.x+b.x)/2, (a.y+b.y)/2); pinch0 = d; moved = 99; } });
function up(e){ if (!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = null;
  if (!ptrs.size){ svg.classList.remove("dragging"); if (moved < 6) { downCons !== null ? selectCons(downCons) : downNode ? select(downNode) : select(null); } } }
svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);

// ---------- 面板 ----------
const panel = document.getElementById("panel");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let quiz = null, autoT = null;
const busy = () => quiz && !quiz.done;
const small = () => window.innerWidth <= 820;
const mainEl = document.querySelector("main");
// 手机上答题时把地图缩小，留出答题空间
function setFocus(on){ if (mainEl.classList.contains("focus") === on) return; mainEl.classList.toggle("focus", on); if (small()) setVB(); }

function select(w){ if (busy()) { if (w) toast("先完成这一轮答题"); return; }
  if (w && gOf(w) !== cur) build(gOf(w));
  if (w && rep(w) !== w) { S.folded = S.folded.filter(i => i !== consOf[w]); }   // 选中收起的词：先展开它的星座
  quiz = null; selected = w; selCons = null; save(); paint(); renderPanel(); panel.scrollTop = 0;
  if (w && small()) focusOn(P[w]); else if (w) ensureVisible(P[w]); }
function selectCons(i){ if (busy()) { toast("先完成这一轮答题"); return; }
  quiz = null; selected = null; selCons = i; paint(); renderPanel(); panel.scrollTop = 0;
  if (small()) focusOn(CP[i]); }
function focusOn(p){ const r = svg.getBoundingClientRect(); const ww = 380, hh = ww * r.height / r.width;
  glide({x: p.x - ww/2, y: p.y - hh/2, w: ww, h: hh}); }
// 平滑移动视野
let glideT = 0;
function glide(to){ const from = {...vb}, t0 = performance.now(), id = ++glideT;

  let html = `<div class="eyebrow">擦亮成功</div><div class="big">${esc(w)}</div><div class="meta" style="margin-top:0">${starHtml(S.stars[w]||3)}${z.dust ? `<span class="dust">星尘 +${z.dust}</span>` : ""}</div>
    <div class="cn">${esc(D.words[w].cn)}</div>
    <div class="note">${z.gain ? "一次答对，多了一颗星！" : ""}${z.wasDue ? `下次 ${d} 天后再来看看它。` : ""}</div>`;
  if (f.length) html += `<div class="ctabar"><button class="cta" data-review="${f[0]}" type="button">擦亮下一颗 · 还有 ${f.length} 颗</button></div>`;
  else { const c = candidates(); html += c.length ? `<div class="ctabar"><button class="cta" data-start="${c[0].w}" type="button">继续：${esc(c[0].w)} · ${nQ(c[0].w)} 题</button></div>` : ""; }
  panel.innerHTML = html; bind(panel);
  document.querySelector("[data-start],[data-review]")?.focus({preventScroll:true});
}

// 键盘：1–4 选答案，回车继续
document.addEventListener("keydown", e => { if (!quiz || e.target.closest("input,textarea") || !modal.hidden) return;
  const z = quiz;
  if (!z.done && z.picked === null && /^[1-4]$/.test(e.key)){ const b = panel.querySelector(`[data-k="${+e.key - 1}"]`); if (b && !b.disabled) b.click(); }
  else if (e.key === "Enter" && !z.done && z.picked !== null && z.qs[z.i].opts[z.picked].key === z.qs[z.i].answer){ e.preventDefault(); nextQ(); } });

// ---------- 音效与流星 ----------
let AC = null;
function sfx(kind){ if (S.mute) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume();
    const seq = {ok:[[880,0],[1319,.07]], bad:[[220,0],[175,.12]], light:[[523,0],[659,.08],[784,.16],[1047,.24]], cons:[[523,0],[659,.1],[784,.2],[1047,.3],[1568,.42]]}[kind];
    const t0 = AC.currentTime;
    seq.forEach(([f, dt]) => { const o = AC.createOscillator(), g = AC.createGain();
      o.type = kind === "bad" ? "triangle" : "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + dt); g.gain.exponentialRampToValueAtTime(kind === "bad" ? 0.12 : 0.09, t0 + dt + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.28);
      o.connect(g); g.connect(AC.destination); o.start(t0 + dt); o.stop(t0 + dt + 0.3); }); } catch(e){} }
const stage = document.querySelector(".stage");
function meteor(n){ if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let k = 0; k < n; k++) setTimeout(() => { const m = document.createElement("div"); m.className = "meteor";
    m.style.left = (40 + Math.random() * 60) + "%"; m.style.top = (10 + Math.random() * 35) + "%";
    stage.appendChild(m); setTimeout(() => m.remove(), 1200); }, k * 180); }

// ---------- 重置、提示 ----------
const modal = document.getElementById("modal");
function askReset(){
  modal.innerHTML = `<div class="card"><h2>重新开始？</h2><p>会清除已点亮的 ${S.lit.length} 个词和答题记录，不能恢复。</p>
    <div class="row"><button class="cta" id="yes" type="button" style="background:var(--bad);box-shadow:none">清除并重来</button><button class="cta alt" id="no" type="button" style="margin-top:0">取消</button></div></div>`;
  modal.hidden = false;
  document.getElementById("no").onclick = () => modal.hidden = true;
  document.getElementById("yes").onclick = () => { S = Object.assign(fresh(), {tips: S.tips || {}, mute: S.mute}); recalc(); save(); modal.hidden = true;
    quiz = null; selected = null; selCons = null; build(0); paint(); renderPanel(); };
}
document.getElementById("polishBtn").onclick = () => { const f = fadingWords(); if (!f.length) return; if (busy()) { toast("先完成这一轮答题"); return; } startQuiz(f[0], "review"); };
document.getElementById("muteBtn").onclick = () => { S.mute = !S.mute; save(); paint(); if (!S.mute) sfx("ok"); };

const TIPS = {
  first:  "点<b>开始挑战</b>，答对几道题就能点亮这颗星。",
  stars:  "点亮了！一次全对得 <b>3 颗星</b>，答错会暗一些。拿到的<b>星尘</b>可以换提示卡。",
  choose: "旁边的星能挑战了。地图上的“<b>解锁 3</b>”表示点亮它能再打开 3 颗星。按推荐走，或者自己挑。",
  hint:   "星尘够了！答题时可以用<b>提示卡</b>去掉两个错误选项。",
  cons:   "连成<b>星座</b>了！它已经收起成一颗大星，点它可以展开。",
  galaxy: "开放了新的<b>星系</b>！在地图上方切换。",
  fade:   "有的星<b>变暗</b>了，说明该复习了。答对 1 题就能把它擦亮。"
};
const tipQ = [];
function tip(key){ if (!S.tips) S.tips = {}; if (S.tips[key] || tipQ.includes(key)) return; tipQ.push(key); showTip(); }
function showTip(){ const box = document.getElementById("tip"); if (!box.hidden || !tipQ.length) return;
  const key = tipQ[0]; box.querySelector("p").innerHTML = TIPS[key]; box.hidden = false;
  box.querySelector("button").onclick = () => { S.tips[key] = 1; save(); tipQ.shift(); box.hidden = true; showTip(); }; }
let tt; function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2200); }

load(); build(S.gal); paint(); renderPanel();
if (!S.lit.length) tip("first");
if (fadingWords().length) tip("fade");
addEventListener("resize", () => setVB());
window.__wn = { get S(){ return S; }, set S(v){ S = v; recalc(); }, D, GENS, qMeaning, qRelation, qBlank, qLink, status, candidates, get quiz(){ return quiz; },
  refresh(){ recalc(); build(cur); paint(); renderPanel(); }, save, CONS, recalc, nextQ };
})();
</script>
