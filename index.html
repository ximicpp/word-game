<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1222">
<title>单词星系</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Charis+SIL&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 夜空里的一张词网占满主区域，右侧（手机为下方）是单词与答题面板。单一深色主题。 */
:root{
  --sky:#0b1222; --sky-2:#111a2e; --panel:#141e34; --rule:#26324d;
  --ink:#e9edf6; --muted:#8e9ab5; --dim:#3a4664;
  --lamp:#ffc95c; --lamp-soft:rgba(255,201,92,.18);
  --ready:#9fd8ff; --good:#7fe0a3; --bad:#ff7d8f;
  --t-sound:#6ea8ff; --t-form:#ff9466; --t-syn:#7fe0a3; --t-ant:#ff6f91;
  --t-root:#c49bff; --t-coll:#4fd6e3; --t-topic:#c7cf6d; --t-hyper:#f0a6d6;
  --f-word:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-cn:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-ipa:"Charis SIL","Doulos SIL","Lucida Sans Unicode","Times New Roman",serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--sky);color:var(--ink);font-family:var(--f-cn);font-size:15px;line-height:1.55;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ready);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);overflow:hidden}
header{padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;border-bottom:1px solid var(--rule);background:var(--sky-2)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.04em}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.prog{flex:1 1 320px;display:flex;align-items:center;gap:14px;min-width:0;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.lvb{font-family:var(--f-mono);font-size:12px;font-weight:700;color:#2b1d00;background:var(--lamp);border-radius:99px;padding:2px 8px;white-space:nowrap;box-shadow:0 0 10px rgba(255,201,92,.45)}
.prog:hover .lvb{box-shadow:0 0 16px var(--lamp)}
/* v1.6：观星者等级与考纲里程碑 */
.lvhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.lvhead .lvb{font-size:15px;padding:3px 10px}
.lvhead b{font-size:20px}
.mbar{position:relative;height:10px;border-radius:99px;background:var(--rule);overflow:hidden;margin:8px 0 4px}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,#f6a93b,var(--lamp))}
.mbar s{position:absolute;top:0;bottom:0;width:1px;background:var(--panel);opacity:.9}
.exam{margin-top:14px}
.exam .top{display:flex;justify-content:space-between;font-size:14px}
.exam .top span{color:var(--muted);font-variant-numeric:tabular-nums}
.exam .ms{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.exam .ms .on{color:var(--lamp)}
.statline{margin-top:16px;font-size:13px;color:var(--muted)}
.badge.stage{border-color:var(--lamp);box-shadow:0 0 22px rgba(255,201,92,.25)}
.wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin:0 0 16px}
.wk div{background:var(--sky-2);border:1px solid var(--rule);border-radius:10px;padding:10px;text-align:center}
.wk b{display:block;font-size:24px;color:var(--lamp);font-variant-numeric:tabular-nums}
.wk span{font-size:12px;color:var(--muted)}
.badge .wl{font-family:var(--f-word);font-size:14px;color:var(--muted);margin-top:6px;line-height:1.6}
.bar{flex:1;height:8px;border-radius:99px;background:var(--rule);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f6a93b,var(--lamp));box-shadow:0 0 12px var(--lamp);transition:width .6s ease}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.count b{color:var(--lamp);font-size:18px}
.stat{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ghost{background:none;border:1px solid var(--rule);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}

main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;
  background:radial-gradient(1200px 700px at 30% 20%,#16213d 0%,var(--sky) 60%)}
#net{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#net.dragging{cursor:grabbing}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 90px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:12px;
  background:rgba(20,30,52,.85);border:1px solid var(--rule);color:var(--ink)}
.chip i{width:14px;height:3px;border-radius:2px;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.4}
.chip[aria-pressed="false"] i{background:var(--dim)}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:8px;background:rgba(20,30,52,.9);border:1px solid var(--rule);font-size:16px}

/* 网络图 */
.edge{stroke-width:1.2;opacity:.16;transition:opacity .4s,stroke-width .4s}
.edge.half{opacity:.4}
.edge.weak{opacity:.07}
.edge.weak.half{opacity:.22}
.edge.weak.lit{opacity:.55;stroke-width:1.4}
.edge.lit{opacity:.95;stroke-width:2}
.edge.hl{opacity:1;stroke-width:2.6}
.edge.off{display:none}
.node{cursor:pointer}
.node .dot{fill:var(--dim);stroke:none;transition:fill .4s}
.node .ring{fill:none;stroke:none}
.node .halo{fill:var(--lamp);opacity:0;transition:opacity .6s}
.node text{font-family:var(--f-word);font-size:13px;fill:var(--muted);paint-order:stroke;stroke:var(--sky);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.node.ready .dot{fill:var(--sky)}
.node.ready .ring{stroke:var(--ready);stroke-width:2;stroke-dasharray:3 3;animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.node.ready text{fill:var(--ink)}
.node.lit .dot{fill:var(--lamp)}
.node.lit .halo{opacity:.22}
.node.lit text{fill:#fff3d6;font-weight:700}
.node.sel .ring{stroke:#fff;stroke-width:2;stroke-dasharray:none;animation:none}
.node.dim{opacity:.22}
.node:focus{outline:none}
.node:focus-visible .ring{stroke:#fff;stroke-width:2}
.node.pop .halo{animation:pop 1.2s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{opacity:.9;transform:scale(.6)}100%{opacity:.22;transform:scale(1)}}
.node .halo{transform-box:fill-box;transform-origin:center}

/* 面板 */
aside{border-left:1px solid var(--rule);background:var(--panel);overflow:auto;min-height:0;
  padding-block:20px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.word{font-family:var(--f-word);font-weight:700;font-size:40px;line-height:1.1;margin:6px 0 2px;letter-spacing:-.01em}
.ipa{font-family:var(--f-ipa);font-size:18px;color:var(--muted)}
.cn{font-size:18px;margin-top:8px}
.hidden-cn{color:var(--muted);font-size:14px;margin-top:8px}
.ex{margin-top:10px;font-family:var(--f-word);font-weight:500;color:#cfd6e6;font-size:15px;border-left:2px solid var(--rule);padding-left:10px}
.state{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--rule)}
.state.lit{color:var(--lamp);border-color:rgba(255,201,92,.5)}
.state.ready{color:var(--ready);border-color:rgba(159,216,255,.45)}
.state.locked{color:var(--muted)}
.sec{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.group{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:start}
.group .t{font-size:12px;color:var(--c);padding-top:4px;display:flex;align-items:center;gap:6px}
.group .t::before{content:"";width:10px;height:3px;border-radius:2px;background:var(--c)}
.nbs{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.nb{font-family:var(--f-word);font-size:14px;padding:3px 10px;border-radius:8px;background:var(--sky-2);border:1px solid var(--rule)}
.nb.lit{border-color:rgba(255,201,92,.55);color:var(--lamp)}
.nb.ready{border-color:rgba(159,216,255,.4)}
.nb:hover{border-color:var(--ink)}
.cta{margin-top:22px;width:100%;padding:12px 16px;border-radius:10px;border:none;font-size:16px;font-weight:600;
  background:var(--lamp);color:#2b1d00;box-shadow:0 0 24px rgba(255,201,92,.35)}
.cta:disabled{background:var(--rule);color:var(--muted);box-shadow:none;cursor:not-allowed}
.cta.alt{background:none;border:1px solid var(--rule);color:var(--ink);box-shadow:none}
.note{font-size:13px;color:var(--muted);margin-top:10px}

.qhead{display:flex;justify-content:space-between;align-items:center}
.pips{display:flex;gap:6px}
.pips i{width:22px;height:6px;border-radius:3px;background:var(--rule)}
.pips i.ok{background:var(--good)}
.pips i.now{background:var(--ready)}
.pips i.no{background:var(--bad)}
.q{font-size:18px;margin:16px 0 14px;text-wrap:balance}
.q .w{font-family:var(--f-word);font-weight:700;color:var(--ready)}
.q .sent{display:block;font-family:var(--f-word);font-weight:500;font-size:19px;margin-top:8px;color:var(--ink)}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:10px;background:var(--sky-2);border:1px solid var(--rule);font-size:16px;display:flex;justify-content:space-between;gap:10px}
.opt.en{font-family:var(--f-word);font-weight:500;font-size:18px}
.opt:hover:not(:disabled){border-color:var(--ready)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:rgba(127,224,163,.1)}
.opt.wrong{border-color:var(--bad);background:rgba(255,125,143,.1)}
.opt small{font-family:var(--f-cn);font-size:13px;color:var(--muted);font-weight:400;align-self:center}
.explain{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--sky-2);font-size:14px}
.explain b{color:var(--good)}
.explain.bad b{color:var(--bad)}
.big{font-family:var(--f-word);font-size:46px;font-weight:700;color:var(--lamp);text-shadow:0 0 28px rgba(255,201,92,.6);margin:8px 0}
.unlocked{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.modal{position:fixed;inset:0;background:rgba(5,9,18,.78);display:grid;place-items:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:24px;max-width:460px;width:100%}
.card h2{margin:0 0 6px;font-size:22px}
.card p{margin:0 0 16px;color:var(--muted);font-size:14px}
.starts{display:grid;gap:10px}
.start{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:10px;background:var(--sky-2);border:1px solid var(--rule);text-align:left}
.start:hover{border-color:var(--lamp)}
.start b{font-family:var(--f-word);font-size:22px}
.start span{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;margin-top:8px}
.row .cta{margin-top:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--lamp);color:#2b1d00;
  padding:8px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:30;box-shadow:0 0 30px rgba(255,201,92,.5)}


/* 星级、变暗、星座 */
.node.lit.s1 .halo{opacity:.09}
.node.lit.s2 .halo{opacity:.17}
.node.lit.s3 .halo{opacity:.3}
.node.lit.s1 .dot,.node.lit.s2 .dot{transform-box:fill-box;transform-origin:center}
.node.lit.s1 .dot{transform:scale(.75)}
.node.lit.fade .dot{fill:#8a7440}
.node.lit.fade .halo{opacity:.04}
.node.lit.fade text{fill:#b9a676;font-weight:500}
.node.lit.fade .ring{stroke:#b99a5a;stroke-width:1.5;stroke-dasharray:2 3;animation:spin 10s linear infinite;transform-box:fill-box;transform-origin:center}
.node.gone{display:none}
/* v1.7：恒星（已掌握） */
.node.lit.giant .dot{fill:#fff4d0}
.node.lit.giant .halo{opacity:.5;fill:#ffd36b}
.node.lit.giant .ring{stroke:#ffe8a8;stroke-width:1.2;stroke-dasharray:none;animation:none}
.node.lit.giant text{fill:var(--lamp)}
.giantb{font-size:12px;color:#2b1d00;background:linear-gradient(90deg,#ffd36b,#fff4d0);border-radius:99px;padding:1px 8px;font-weight:700}
.cglow{stroke:var(--lamp);stroke-width:7;opacity:.16;stroke-linecap:round}
.clabel{font-family:var(--f-cn);font-size:12px;fill:var(--lamp);opacity:.75;paint-order:stroke;stroke:var(--sky);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.super{cursor:pointer}
.super .halo{fill:var(--lamp);opacity:.18;transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
.super .core{fill:var(--lamp);stroke:#fff3d6;stroke-width:2}
.super .rays{stroke:var(--lamp);stroke-width:1.5;opacity:.6}
.super text{font-family:var(--f-cn);font-size:14px;font-weight:700;fill:#fff3d6;paint-order:stroke;stroke:var(--sky);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.super text.n{font-family:var(--f-mono);font-size:11px;font-weight:500;fill:#2b1d00;stroke:none}
.super.fade .core{fill:#8a7440;stroke:#b99a5a}
.super.fade .halo{opacity:.06;animation:none}
.super.sel .core{stroke:#fff;stroke-width:3}
.super.dim{opacity:.35}
.super:focus{outline:none}
.super:focus-visible .core{stroke:var(--ready);stroke-width:3}
.bundle{stroke-width:2.2;opacity:.85}
.bundle.half{opacity:.45;stroke-width:1.6}
.bundle.hl{opacity:1;stroke-width:3}
.bcount circle{fill:var(--sky-2);stroke:var(--rule)}
.bcount text{font-family:var(--f-mono);font-size:10px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.stars{color:var(--lamp);letter-spacing:2px;font-size:18px}
.stars i{font-style:normal;color:var(--dim)}
.combo{font-family:var(--f-mono);font-size:12px;color:var(--lamp);white-space:nowrap}
.combo[hidden]{display:none}
.polish{border-color:rgba(255,201,92,.5);color:var(--lamp)}
.conslist{display:grid;gap:6px}
.consrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;background:var(--sky-2);border:1px solid var(--rule);text-align:left;font-size:14px}
.consrow.done{border-color:rgba(255,201,92,.5);color:var(--lamp)}
.consrow span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.consrow.done span{color:var(--lamp)}
.badge{margin-top:16px;padding:14px;border-radius:10px;border:1px solid rgba(255,201,92,.5);background:var(--lamp-soft)}
.badge b{color:var(--lamp);font-size:18px}
.badge p{margin:6px 0 0;font-size:14px;color:var(--ink)}
.linkrow{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.linkrow b{font-family:var(--f-word);color:var(--ink);font-weight:500}
.linkrow i{font-style:normal;color:var(--c)}
.node .gain{font-family:var(--f-cn);font-size:11px;font-weight:600;fill:var(--ready);stroke:var(--sky);stroke-width:3px;paint-order:stroke;opacity:0;pointer-events:none}
.node.ready .gain{opacity:1}
.diff{display:inline-flex;gap:3px;vertical-align:middle}
.diff i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.diff i.on{background:var(--t-form)}
.dust{color:var(--lamp);font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.preview{margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;color:var(--muted);padding:12px 14px;border-radius:10px;background:var(--sky-2);border:1px solid var(--rule)}
.preview b{color:var(--ink);font-weight:600}
.cands{display:grid;gap:6px}
.cand{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;background:var(--sky-2);border:1px solid rgba(159,216,255,.4);text-align:left;font-size:12px;color:var(--muted)}
.cand b{font-family:var(--f-word);font-size:15px;color:var(--ink);font-weight:500}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tool{background:none;border:1px dashed rgba(255,201,92,.5);color:var(--lamp);border-radius:8px;padding:6px 10px;font-size:13px}
.tool:disabled{opacity:.4;cursor:not-allowed}
.ctabar .cta{margin-top:16px}
.tip{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:52px;z-index:25;width:min(440px,calc(100% - 76px));
  background:#1b2742;border:1px solid rgba(255,201,92,.6);border-radius:12px;padding:14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.5);display:flex;gap:12px;align-items:flex-start}
.tip p{margin:0;font-size:15px;flex:1}
.tip p b{color:var(--lamp)}
.tip button{flex:none;background:var(--lamp);color:#2b1d00;border:none;border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px}
.opt.cut{opacity:.28;text-decoration:line-through}
.meteor{position:absolute;width:140px;height:2px;border-radius:2px;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,243,214,0),#fff3d6);box-shadow:0 0 10px #ffc95c;transform:rotate(-24deg);animation:fly 1.1s ease-in forwards}
@keyframes fly{0%{opacity:0;translate:0 0}15%{opacity:1}100%{opacity:0;translate:-420px 190px}}

/* v1.1：星空背景、推荐标记、幸运星、点亮动画、今日目标 */
.sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node.locked text{opacity:.6}
.node.ready:not(.rec):not(.sel) .gain{opacity:0}
.node.rec .ring{stroke-width:2.5}
.node.lucky .ring{stroke:var(--lamp);stroke-dasharray:2 3}
.node .luck{font-size:13px;fill:var(--lamp);opacity:0;pointer-events:none}
.node:not(.lucky) .luck{display:none}
.node.lucky .luck{opacity:1;animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.35}}
.edge.flow{stroke-dasharray:5 7;stroke-width:2.6;opacity:1;animation:flow .9s linear 3}
@keyframes flow{to{stroke-dashoffset:-24}}
.spark{fill:#fff3d6;transform-box:fill-box;transform-origin:center;animation:burst .9s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.goal{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.goal svg{width:20px;height:20px;transform:rotate(-90deg)}
.goal circle{fill:none;stroke-width:3}
.goal .bg{stroke:var(--rule)}
.goal .fg{stroke:var(--lamp);stroke-linecap:round;transition:stroke-dashoffset .6s}
.goal.done{color:var(--lamp)}
/* v1.9：地图图例、筛选和单词本 */
.mapkey{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;z-index:4;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 70px)}
.mapkey button{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 9px;border-radius:99px;background:rgba(20,30,52,.9);border:1px solid var(--rule);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.mapkey button.on{border-color:var(--lamp);color:var(--ink)}
.mapkey b{font-weight:700;color:var(--ink)}
.mapkey i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.mapkey .k-lit{background:var(--lamp);box-shadow:0 0 6px var(--lamp)}
.mapkey .k-ready{border:1.5px dashed var(--ready)}
.mapkey .k-locked{background:var(--dim)}
.mapkey .book{color:var(--lamp);border-color:rgba(255,201,92,.5)}
.node .cnl{display:none;font-family:var(--f-cn);font-size:11px;font-weight:400}
#net.v-lit .node.lit .cnl{display:block;fill:#e8d6a8}
#net.v-lit .node:not(.lit),#net.v-ready .node.locked{opacity:.08}
#net.v-lit .node:not(.lit) text,#net.v-ready .node.locked text{display:none}
#net.v-ready .node.lit{opacity:.35}
#net.v-lit .edge:not(.lit),#net.v-ready .edge:not(.half){opacity:.03}
.book-card{max-width:640px;max-height:min(86vh,760px);display:flex;flex-direction:column;padding:20px}
.book-card .tabs{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap}
.book-card .tabs button{font-size:13px;padding:5px 12px;border-radius:99px;border:1px solid var(--rule);background:transparent;color:var(--muted)}
.book-card .tabs button.on{border-color:var(--lamp);color:var(--lamp)}
.book-list{overflow-y:auto;flex:1;min-height:0;margin:0 -6px;padding:0 6px}
.bgrp{margin-bottom:14px}
.bgrp h3{font-size:13px;font-weight:700;color:var(--lamp);margin:0 0 6px;display:flex;justify-content:space-between}
.bgrp h3 span{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.bw{display:flex;flex-wrap:wrap;gap:6px}
.bw button{font-size:13px;padding:4px 9px;border-radius:8px;border:1px solid var(--rule);background:var(--sky-2);color:var(--muted);text-align:left;line-height:1.3}
.bw button b{font-family:var(--f-word);font-weight:600}
.bw button small{display:block;font-size:11px;color:#c9b88a}
.bw .lit{border-color:rgba(255,201,92,.55);color:var(--ink)}
.bw .lit b{color:var(--lamp)}
.bw .ready{border-style:dashed;border-color:var(--ready);color:var(--ink)}
.bw .locked{opacity:.55}
.q .spellw{display:block;font-size:30px;letter-spacing:.06em;margin-top:8px}
.q .spellw .gap{color:var(--lamp);letter-spacing:.15em}
.stk i{font-style:normal}
.stk{font-family:var(--f-mono);font-size:11px;color:#2b1d00;background:var(--lamp);border-radius:99px;padding:1px 7px;font-weight:700}
.streak{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 4px;padding:10px 12px;background:var(--sky-2);border:1px solid var(--rule);border-radius:10px;font-size:13px}
.streak b{font-size:20px;color:var(--lamp);font-variant-numeric:tabular-nums}
.streak .ms{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 8px}
.streak .ms .on{color:var(--lamp)}
.guardb{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--lamp);background:transparent;color:var(--lamp);cursor:pointer;white-space:nowrap}
.guardb:disabled{opacity:.45;cursor:default}
.luckline{display:flex;align-items:center;gap:8px;margin-top:14px;padding:9px 12px;border-radius:10px;border:1px dashed rgba(255,201,92,.55);background:none;color:var(--lamp);font-size:14px;width:100%;text-align:left}

.luckline span{margin-left:auto;font-size:12px;color:var(--muted)}
.gal.next{border-style:dashed;opacity:.6}

.banks{display:grid;gap:8px;margin-top:4px}
.bank{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;padding:12px 14px;border-radius:10px;background:var(--sky-2);border:1px solid var(--rule)}
.bank b{font-family:var(--f-word);font-size:18px}
.bank small{grid-column:1;color:var(--muted);font-size:12px}
.bank span{grid-row:1/3;grid-column:2;font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.bank.on{border-color:var(--lamp);box-shadow:0 0 16px rgba(255,201,92,.2)}
.bank:hover{border-color:var(--ready)}
#vp.swap{transition:opacity .22s ease;opacity:0}
/* 星系切换条 */
.gbar{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;z-index:3;
  padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--sky) 40%,rgba(11,18,34,0))}
.gbar::-webkit-scrollbar{display:none}
.gal{flex:none;display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:13px;background:rgba(20,30,52,.9);border:1px solid var(--rule);color:var(--ink)}
.gal span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.gal.cur{border-color:var(--lamp);color:var(--lamp);box-shadow:0 0 14px rgba(255,201,92,.25)}
.gal.cur span{color:var(--lamp)}
.gal.has{border-color:rgba(159,216,255,.5)}
.gal:disabled{opacity:.38;cursor:not-allowed}
.gal.full{background:var(--lamp-soft)}
#net.far .node.locked text,#net.far .node.ready:not(.rec):not(.sel):not(.nb):not(.imp3) text{display:none}
#net.far .node.locked .dot{r:4}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.meta .go{color:var(--lamp)}
.lede{font-size:15px;color:var(--ink);margin:0 0 16px}
.qx{background:none;border:none;color:var(--muted);font-size:13px;padding:2px 4px}
.qx:hover{color:var(--ink)}
.auto{height:3px;border-radius:2px;background:var(--rule);margin-top:12px;overflow:hidden}
.auto i{display:block;height:100%;width:100%;background:var(--good);transform-origin:left;animation:drain var(--d,1.4s) linear forwards}
@keyframes drain{from{transform:scaleX(0)}to{transform:scaleX(1)}}
details.fold{margin-top:22px;border-top:1px solid var(--rule);padding-top:14px}
details.fold summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none;display:flex;justify-content:space-between}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"展开";font-size:12px}
details.fold[open] summary::after{content:"收起"}
details.fold[open] summary{margin-bottom:10px}
.keys{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.keys span{display:inline-flex;align-items:center;gap:5px}
.keys i{width:12px;height:3px;border-radius:2px;background:var(--c)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.links{display:grid;gap:4px;margin-top:8px}
/* 选中一个词：相关的词全部显示名字，侧栏列出关系 */
#net .node.nb,#net .node.sel{opacity:1!important}
#net .node.nb text:not(.gain):not(.luck):not(.cnl),#net .node.sel text:not(.gain):not(.luck):not(.cnl){display:block!important;opacity:1;fill:var(--ink)}
#net .node.nb.lit text:not(.gain):not(.luck):not(.cnl){fill:#fff3d6}
#net .node.nb.locked .dot{fill:#6b7898}
#net .edge.hl{opacity:1!important;display:inline}
/* 自由浏览：没学会的词是安静的小点，只有推荐、选中、幸运星才有虚线圈 */
.node.ready:not(.rec):not(.sel):not(.lucky) .ring{stroke:none;animation:none}
/* 没点亮：星和边都是虚线；两端都点亮的边才是亮的实线 */
.node.ready .dot{fill:none;stroke:#56648a;stroke-width:1.3;stroke-dasharray:2 2}
.node.ready.imp2 .dot{stroke:#7181a8;stroke-width:1.5}
.node.ready.imp3 .dot{stroke:#9aa8cf;stroke-width:1.8}
.node.ready.rec .dot,.node.ready.sel .dot,.node.ready.nb .dot{stroke:var(--ink)}
#net .edge:not(.lit),#net .bundle.half,.xedge{stroke-dasharray:4 5}
#net .edge.lit{stroke-dasharray:none}
.node.ready.imp3 text{fill:#c8d2ec}
.cand .mag{color:var(--lamp);font-size:11px}
.node.ready text{fill:var(--muted)}
.node.ready.rec text{fill:var(--ink)}
/* 重要词：更大、点亮后更亮 */
/* 星等：没点亮时是暗淡的小点（越重要越大一点），点亮后按星等变亮变大 */
.node.ready .dot{r:3}
.node.ready.imp2 .dot{r:4}
.node.ready.imp3 .dot{r:5.2}
.node.ready.rec .dot,.node.ready.sel .dot,.node.ready.nb .dot{r:5}
.node.lit .dot{r:5}
.node.lit.imp2 .dot{r:6.5}
.node.lit.imp3 .dot{r:8.5}
#net.allv .edge{opacity:.07}
#net.allv .edge.weak{opacity:.035}
#net.allv .edge.half{opacity:.22}
#net.allv .edge.lit{opacity:.95;stroke-width:2.2}
#net.allv .edge.hl{opacity:1}
.node.imp3 text{font-size:15px;font-weight:700}
.node.lit.imp2 .halo{opacity:.36}
.node.lit.imp3 .halo{opacity:.5;transform:scale(1.2)}
.node.lit.imp3 .dot{fill:#fff1c4}
.node.lit.fade.imp2 .halo,.node.lit.fade.imp3 .halo{opacity:.08}
.imp{font-size:12px;color:var(--lamp)}
.cand .cn1{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glabel{font-family:var(--f-cn);font-size:90px;font-weight:700;fill:var(--lamp);opacity:.55;pointer-events:none;paint-order:stroke;stroke:var(--sky);stroke-width:10px}
#net.allv .edge.xg{opacity:.035}
#net.allv:not(.far) .glabel{opacity:.12}
#net.allv .edge.xg.lit{opacity:.25}
#net.allv .edge.xg.hl{opacity:1}
#net.allv.far .node:not(.lit):not(.sel):not(.nb):not(.rec) text{display:none}
#net.allv .clabel{display:none}
.xedge{stroke-width:2;stroke-dasharray:5 4;opacity:.9}
#net .xnode text{display:block!important;opacity:1;fill:var(--ink)}
#net .xnode .xgal{font-family:var(--f-cn);font-size:10px;font-weight:400;fill:var(--muted)}
#net .xnode.lit text:not(.xgal){fill:#fff3d6}
#net .xnode .dot{fill:#6b7898}
#net .xnode.lit .dot{fill:var(--lamp)}
#net .xnode.ready .dot{fill:var(--sky)}
.rel{display:grid;gap:6px;margin-top:8px}
.rel button{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;text-align:left;padding:8px 10px;border-radius:10px;background:var(--sky-2);border:1px solid var(--rule);color:var(--muted);font-size:13px;line-height:1.4}
.rel button:hover{border-color:var(--ready)}
.rel .t{grid-row:span 2;align-self:start;font-size:12px;color:var(--c);border:1px solid var(--c);border-radius:6px;padding:1px 6px;white-space:nowrap;margin-top:2px}
.rel .h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.rel .h b{font-family:var(--f-word);font-weight:600;font-size:15px;color:var(--ink)}
.rel .h .st{font-size:11px;padding:0 6px;border-radius:99px;border:1px solid var(--rule)}
.rel .lit .h b{color:var(--lamp)}
.rel .lit .st{color:var(--lamp);border-color:rgba(255,201,92,.5)}
.rel .ready .st{color:var(--ready);border-color:var(--ready);border-style:dashed}
.rel .h .cnm{color:#c9b88a}
.rel .h .gx{font-size:11px;color:var(--muted)}
.pairs{display:grid;gap:3px;margin-top:6px;font-size:13px;color:var(--muted)}
.pairs b{font-family:var(--f-word);font-weight:500;color:var(--ink)}
.pairs i{font-style:normal;color:var(--c)}
.links div{font-size:13px;color:var(--muted)}
.links b{font-family:var(--f-word);font-weight:500;color:var(--ink)}
.links i{font-style:normal;color:var(--c)}

@media (max-width:820px){
  .goal #goalTxt{display:none}
  .stk i{display:none}
  .stk{padding:1px 5px}
  .brand h1{display:none}

  *{animation:none!important;transition:none!important}
}

/* v1.10 清爽星空：只显示选中的词和它的相关词的名字；悬停时显示 */
#net.allv .node:not(.sel):not(.nbl):not(:hover):not(:focus-visible) text:not(.luck){display:none!important}
#net.allv.v-lit.v-lit .node.lit.lit text:not(.gain):not(.luck){display:block!important}
#net.allv .edge:not(.lit):not(.half):not(.hl){opacity:.045}
#net.allv .edge.weak:not(.lit):not(.half):not(.hl){opacity:.02}
#net.allv .edge.half:not(.hl){opacity:.1}
/* 部分点亮：从亮的一端透出光 */
.hglow{stroke:var(--lamp);stroke-linecap:round;pointer-events:none}
.hglow.h1{stroke-width:1.4;opacity:.22}
.hglow.h2{stroke-width:1.8;opacity:.4}
#net.sel-on #halfs{opacity:.25}
#net.allv .edge.lit:not(.hl){opacity:.6;stroke-width:1.5}
#net.allv .edge.weak.lit:not(.hl){opacity:.16;stroke-width:1.1}
#net.sel-on .edge.lit:not(.hl){opacity:.22}
#net.v-ready #halfs,#net.v-lit #halfs{display:none}
/* 答题进度：外圈一段段亮起 */
.node .prog{fill:none;stroke:none}
.node.charging .prog{stroke:var(--lamp);stroke-width:2.6;stroke-linecap:round;transition:stroke-dasharray .5s ease-out;filter:drop-shadow(0 0 3px rgba(255,201,92,.8))}
/* 点亮：先暗后燃起 */
.node .dot{transform-box:fill-box;transform-origin:center}
.node.ignite .dot{animation:ignite 1.1s cubic-bezier(.2,.8,.3,1.2) .38s backwards}
.node.ignite .halo{animation:igniteHalo 1.6s ease-out .38s backwards}
.node.ignite text{animation:igniteTxt 1.2s ease-out .5s backwards}
@keyframes ignite{0%{transform:scale(.35);fill:#56648a;opacity:.6}35%{transform:scale(1.9);fill:#fff;opacity:1}100%{transform:scale(1)}}
@keyframes igniteHalo{0%{opacity:0;transform:scale(.3)}30%{opacity:.95;transform:scale(1.6)}100%{transform:scale(1)}}
@keyframes igniteTxt{0%{opacity:0;fill:#fff}100%{opacity:1}}
.wave{fill:none;stroke:#ffe3a3;stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:wave 1.1s ease-out backwards}
@keyframes wave{0%{opacity:.95;transform:scale(1);stroke-width:3}100%{opacity:0;transform:scale(var(--s));stroke-width:.4}}
.beam line{fill:none;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1;animation:beam var(--d) cubic-bezier(.4,0,.2,1) forwards}
.beam .bw{stroke:var(--lamp);stroke-width:7;opacity:.28}
.beam .bc{stroke:#fff6dc;stroke-width:2.4}
.beam.out{transition:opacity .45s;opacity:0}
@keyframes beam{to{stroke-dashoffset:0}}
#net .edge.lit.wait{opacity:.1!important;stroke-dasharray:4 5}
.node.ping .halo{animation:ping .85s ease-out}
.node.ping .dot{animation:pingDot .6s ease-out}
@keyframes ping{0%{opacity:.9;transform:scale(.5)}100%{transform:scale(1.15)}}
@keyframes pingDot{40%{transform:scale(1.5);fill:#fff}}
.fxtxt{font-family:var(--f-cn);font-size:14px;font-weight:700;fill:var(--lamp);paint-order:stroke;stroke:var(--sky);stroke-width:4px;animation:fxtxt 1.8s ease-out forwards;pointer-events:none}
@keyframes fxtxt{0%{opacity:0;transform:translateY(6px)}20%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

/* v1.10b 清晰星空：平时没点亮的星是实心小暗点、没点亮的边不画；只有选中词的连线和相关词才用虚线 */
#net.allv .edge:not(.lit):not(.hl){display:none}
#net.allv .edge.hl:not(.lit){stroke-dasharray:4 5}
.node.ready .dot{stroke:none;stroke-dasharray:none;fill:#3e4a6a}
.node.ready .dot{r:1.8}
.node.ready.imp2 .dot{r:2.5;fill:#4f5c84;stroke:none}
.node.ready.imp3 .dot{r:3.3;fill:#5d6a94;stroke:none}
.node.ready.near .dot{fill:#5a5446}
.node.ready.near.imp2 .dot{fill:#6b6250}
.node.ready.near.imp3 .dot{fill:#847455}
.node.ready.sel .dot,.node.ready.nb .dot,.node.ready.rec .dot,.node.ready.nb.imp2 .dot,.node.ready.nb.imp3 .dot,.node.ready.sel.imp2 .dot,.node.ready.sel.imp3 .dot,.node.ready.rec.imp2 .dot,.node.ready.rec.imp3 .dot{r:4.5;fill:var(--sky);stroke:var(--ink);stroke-width:1.4;stroke-dasharray:2 2}
#net.sel-on .node.ready:not(.sel):not(.nb) .dot{opacity:.5}
</style>

<script>

// 词库选择：换词库会重新载入页面；点亮记录按词保存，不同词库之间共用

  const all = Object.values(RAW.words), lit = new Set(S.lit);
  modal.innerHTML = `<div class="card"><h2>选择词库</h2><p>同一个词在不同词库里只要点亮一次。</p><div class="banks">${Object.entries(BANKS).map(([k, b]) => {
      const ws = Object.entries(RAW.words).filter(([, d]) => b.lv.includes(d.lv)), n = ws.filter(([w]) => lit.has(w)).length;
      return `<button type="button" class="bank${k === BANK ? " on" : ""}" data-bank="${k}"><b>${b.name}</b><small>${b.note}</small><span>${ws.length} 词${n ? `<br>已亮 ${n}` : ""}</span></button>`; }).join("")}</div>
    <div class="row"><button class="cta alt" id="no" type="button">取消</button></div></div>`;
  modal.hidden = false;
  document.getElementById("no").onclick = () => modal.hidden = true;
  modal.querySelectorAll("[data-bank]").forEach(b => b.onclick = () => { const k = b.dataset.bank; if (k === BANK) { modal.hidden = true; return; }
    S.bank = k; S.gal = 0; save(); location.reload(); });
}
// 每周回顾：每周第一次打开时，对比上次的快照
const weekKey = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dayKey(d.getTime()); };
const snap = () => ({k: weekKey(now()), lit: S.lit.length, giant: giantCount(), pol: S.polished || 0, lvl: lvOf(S.lit.length), cons: GC.flat().filter(consDone).length});
function weekly(){
  const w = S.week, cur = snap();
  if (!w || !S.lit.length) { S.week = cur; save(); return; }
  if (w.k === cur.k) return;
  S.week = cur; save();
  const dl = cur.lit - w.lit, dg = cur.giant - w.giant, dp = cur.pol - w.pol, dv = cur.lvl - w.lvl;
  const lastWeek = w.k === weekKey(now() - 7 * DAY);
  const n = S.lit.length, lv = lvOf(n), top = lv >= LV_AT.length;
  const items = [[dl, "颗新点亮"], [dp, "次擦亮"], [dg, "颗新恒星"], [dv, "级升级"]].filter(([v]) => v > 0);
  modal.innerHTML = `<div class="card"><h2>新的一周</h2>
    <p>${items.length ? `${lastWeek ? "上周" : "上次以来"}你收获了：` : "新的一周，从这里继续。"}</p>
    ${items.length ? `<div class="wk">${items.map(([v, t]) => `<div><b>${v}</b><span>${t}</span></div>`).join("")}</div>` : ""}
    <p>${top ? "已经满级了，去把更多星变成恒星吧。" : `这周再点亮 <b style="color:var(--lamp)">${LV_AT[lv] - n}</b> 颗，就能升到 Lv.${lv + 1}。`}</p>
    <div class="row"><button class="cta" id="no" type="button">开始这一周</button></div></div>`;
  modal.hidden = false;
  document.getElementById("no").onclick = () => modal.hidden = true; }
// 我的星图：等级、考纲进度和里程碑
function showLevel(){ if (busy()) { toast("先完成这一轮答题"); return; }
  const n = S.lit.length, lv = lvOf(n), top = lv >= LV_AT.length, c = examLit();
  const lvBar = top ? 100 : (n - LV_AT[lv - 1]) / (LV_AT[lv] - LV_AT[lv - 1]) * 100;
  if (!S.ms) S.ms = {};
  const ticks = `<s style="left:25%"></s><s style="left:50%"></s><s style="left:75%"></s>`;
  const exams = EXAMS.filter(e => LVS.includes(e.lv) || c[e.lv]).map(e => { const k = c[e.lv] || 0, t = EXAM_N[e.lv];
    return `<div class="exam"><div class="top"><b>${e.name} <small style="color:var(--muted);font-weight:400">${e.note}</small></b><span>${k} / ${t} · ${pct(k, t)}%</span></div>
      <div class="mbar"><i style="width:${k / t * 100}%"></i>${ticks}</div>
      <div class="ms">${QUARTERS.map(q => { const key = e.lv + ":" + q, d = S.ms[key];
        return `<span class="${key in S.ms ? "on" : ""}">${key in S.ms ? "★" : "☆"} ${q}%${d ? " · " + mdText(d) : ""}</span>`; }).join("")}</div></div>`; }).join("");
  modal.innerHTML = `<div class="card"><div class="lvhead"><span class="lvb">Lv.${lv}</span><b>${titleOf(lv)}</b></div>
    <div class="mbar"><i style="width:${lvBar}%"></i></div>
    <p>${top ? "已经满级了！" : `再点亮 <b style="color:var(--lamp)">${LV_AT[lv] - n}</b> 颗升到 Lv.${lv + 1}${titleOf(lv + 1) !== titleOf(lv) ? " · " + titleOf(lv + 1) : ""}。`}一共点亮了 ${n} 个词，其中 <b style="color:var(--lamp)">${giantCount()}</b> 颗恒星。</p>
    ${exams}
    <div class="streak"><div><div>连续 <b>${streakNow()}</b> 天 <small style="color:var(--muted)">· 最长 ${Math.max(S.streak && S.streak.best || 0, streakNow())} 天</small></div>
      <div class="ms">${STREAK_MS.slice(0, 6).map(m => `<span class="${m in (S.sms || {}) ? "on" : ""}">${m in (S.sms || {}) ? "★" : "☆"} ${m}天</span>`).join("")}</div></div>
      <div style="text-align:right"><div style="margin-bottom:4px">守护星 ${"◆".repeat(S.guard || 0)}${"◇".repeat(GUARD_MAX - (S.guard || 0))}</div>
      <button type="button" class="guardb" id="buyGuard"${(S.guard || 0) >= GUARD_MAX || S.dust < GUARD_COST ? " disabled" : ""}>${(S.guard || 0) >= GUARD_MAX ? "已经存满" : `${GUARD_COST} 星尘换 1 颗`}</button></div></div>
    <p class="note" style="margin:4px 0 0">每天点亮或擦亮 1 颗星就算连续。守护星最多存 ${GUARD_MAX} 颗，哪天没来会自动用掉 1 颗，连续天数不会断。</p>
    <div class="statline">星座 ${GC.flat().filter(consDone).length} / ${NCONS} · 正确率 ${S.answered ? Math.round(S.correct / S.answered * 100) + "%" : "—"} · 最高连击 ${S.best}</div>
    <div class="row"><button class="cta alt" id="no" type="button">关闭</button></div></div>`;
  modal.hidden = false;
  document.getElementById("no").onclick = () => modal.hidden = true;
  document.getElementById("buyGuard").onclick = () => { if ((S.guard || 0) >= GUARD_MAX || S.dust < GUARD_COST) return;
    S.dust -= GUARD_COST; S.guard = (S.guard || 0) + 1; save(); paint(); sfx("ok"); toast("得到 1 颗守护星"); showLevel(); }; }
document.getElementById("lvBtn").onclick = showLevel;
document.getElementById("bankBtn").textContent = BANKS[BANK].name;
document.getElementById("bankBtn").onclick = askBank;
function askReset(){
  modal.innerHTML = `<div class="card"><h2>重新开始？</h2><p>会清除已点亮的 ${S.lit.length} 个词和答题记录，不能恢复。</p>
    <div class="row"><button class="cta" id="yes" type="button" style="background:var(--bad);box-shadow:none">清除并重来</button><button class="cta alt" id="no" type="button" style="margin-top:0">取消</button></div></div>`;
  modal.hidden = false;
  document.getElementById("no").onclick = () => modal.hidden = true;
  document.getElementById("yes").onclick = () => { S = Object.assign(fresh(), {tips: S.tips || {}, mute: S.mute}); recalc(); save(); modal.hidden = true;
    quiz = null; selected = null; selCons = null; build(0); paint(); renderPanel(); };
}
document.getElementById("polishBtn").onclick = () => { const f = fadingWords(); if (!f.length) return; if (busy()) { toast("先完成这一轮答题"); return; } startQuiz(f[0], "review"); };
document.getElementById("muteBtn").onclick = () => { S.mute = !S.mute; save(); paint(); if (!S.mute) sfx("ok"); };

const TIPS = {
  first:  "点<b>开始挑战</b>，答对几道题就能点亮这颗星。",
  stars:  "点亮了！一次全对得 <b>3 颗星</b>，答错会暗一些。拿到的<b>星尘</b>可以换提示卡。",
  choose: "地图上每颗星都能点开看看，想学哪个就点<b>做题点亮</b>。大一点的星是<b>重要词</b>，题目多一些，点亮后更亮。",
  hint:   "星尘够了！答题时可以用<b>提示卡</b>去掉两个错误选项。",
  cons:   "连成<b>星座</b>了！它已经收起成一颗大星，点它可以展开。",
  galaxy: "开放了新的<b>星系</b>！在地图上方切换。",
  view:   "现在只显示<b>已学会</b>的词，下面写着中文意思。再点一次回到全部。",
  guard:  "星尘够了！点顶栏的<b>等级</b>，可以用 100 星尘换一颗<b>守护星</b>：哪天忘了来，它会帮你保住连续天数。",
  fade:   "有的星<b>变暗</b>了，说明该复习了。答对 1 题就能把它擦亮。"
};
const tipQ = [];
function tip(key){ if (!S.tips) S.tips = {}; if (S.tips[key] || tipQ.includes(key)) return; tipQ.push(key); showTip(); }
function showTip(){ const box = document.getElementById("tip"); if (!box.hidden || !tipQ.length) return;
  const key = tipQ[0]; box.querySelector("p").innerHTML = TIPS[key]; box.hidden = false;
  box.querySelector("button").onclick = () => { S.tips[key] = 1; save(); tipQ.shift(); box.hidden = true; showTip(); }; }
let tt; function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2200); }

// 星空背景：随机小星点，画一次
function sky(){ const c = document.getElementById("sky"), r = c.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  c.width = r.width * dpr; c.height = r.height * dpr; const x = c.getContext("2d"); x.scale(dpr, dpr);
  let sd = 11; const rn = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let k = 0; k < r.width * r.height / 2600; k++){ x.globalAlpha = .15 + rn() * .45; x.fillStyle = rn() < .15 ? "#ffe6b0" : "#cfd8ff";
    x.beginPath(); x.arc(rn() * r.width, rn() * r.height, rn() < .92 ? .7 : 1.3, 0, 7); x.fill(); } }
load(); const guarded = guardCheck(); sky(); setTimeout(sky, 400); build("all"); document.getElementById("gbar").hidden = true; paint(); renderPanel(); weekly();
if (guarded) setTimeout(() => toast(`守护星帮你保住了连续 ${S.streak.c} 天（用掉 ${guarded} 颗）`), 600);
if (!guarded && S.dust >= GUARD_COST && streakNow() >= 2 && !S.guard) tip("guard");
if (!S.lit.length) tip("first");
if (fadingWords().length) tip("fade");
let rz; addEventListener("resize", () => { setVB(); clearTimeout(rz); rz = setTimeout(sky, 200); });
window.__wn = { get S(){ return S; }, set S(v){ S = v; recalc(); }, D, GENS, qMeaning, qRelation, qBlank, qLink, status, candidates, get quiz(){ return quiz; },
  refresh(){ recalc(); build(cur); paint(); renderPanel(); }, save, CONS, recalc, nextQ, lvOf, examPassed, showLevel, startQuiz, weekly, isGiant, giantCount, streakNow, guardCheck, openBook, qLetters, drawGens, select, switchGal, qnOf, tierOf, IMP };
})();
</script>
</body>
